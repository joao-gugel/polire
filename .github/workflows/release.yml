name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Confirm tag matches package version
        shell: bash
        run: |
          package_version=$(bun --print "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v${package_version}"
      - name: Format and lint
        run: bun run format
      - name: Reject formatting changes
        run: git diff --exit-code
      - name: Test
        run: bun run test

  package:
    name: Package ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (.deb)
            os: ubuntu-latest
            script: package:linux
            artifact: linux-deb
            files: release/*.deb
          - name: Windows (.exe)
            os: windows-latest
            script: package:win
            artifact: windows-exe
            files: release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Package application
        run: bun run ${{ matrix.script }}
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: release-files
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --generate-notes --title "Polire ${GITHUB_REF_NAME}"
          fi
          gh release upload "${GITHUB_REF_NAME}" release-files/* --clobber
